name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CloudAgent.slnx

      - name: Build
        run: dotnet build CloudAgent.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test CloudAgent.slnx --no-build --configuration Release --logger "console;verbosity=normal"
